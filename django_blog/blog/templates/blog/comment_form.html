{% extends 'base.html' %}
{% block content %}
  <h2>{% if object %}Edit Comment{% else %}Add Comment{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'post-detail' post.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
